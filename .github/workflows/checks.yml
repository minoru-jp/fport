# すべての検査をまとめた、再利用されるワークフロー。
# push 時の CI(ci.yml)とリリース(release.yml)の両方がこれを呼ぶので、
# どちらも必ず同じ検査を通る。検査の中身は tools/check.py が唯一の置き場所である。
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the project and the checking tools
        run: python -m pip install -e ".[dev]"
      - name: Run every check
        run: python tools/check.py
