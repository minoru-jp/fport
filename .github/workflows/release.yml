# GitHub で Release を公開すると、push 時の CI と同じ検査(checks.yml)を通し、配布物を作って
# 確かめ、最後に文書が公開済みの状態になっているかを確かめたうえで、PyPI に公開する。
# PyPI へは Trusted Publishing(OIDC)で公開するので、API トークンは使わない。
# PyPI 側で、このリポジトリ・このワークフロー(release.yml)・環境 "pypi" を
# Trusted Publisher として登録しておくこと。
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    # push 時の CI とまったく同じ検査。
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the project and the checking tools
        run: python -m pip install -e ".[dev]"
      - name: Build and check the distributions
        # checks.yml と同じ dist の検査に、タグと版の一致を加え、確かめた配布物を dist/ に残す。
        run: python tools/check.py dist --tag "${{ github.event.release.tag_name }}" --dist-dir dist
      - name: Check that the documents are in the published state
        # 最後に、文書がこの版を公開した状態になっているかを確かめる。CHANGELOG の項に公開日がなく、
        # 英語の公開文書がそれに追いついていなければ、ここで止まり、PyPI には公開しない。
        run: python tools/check.py published --tag "${{ github.event.release.tag_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fport/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
